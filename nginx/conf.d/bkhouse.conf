server {
  listen 80;
  server_name bkhouse.tech www.bkhouse.tech;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name bkhouse.tech www.bkhouse.tech;

  ssl_certificate     /etc/letsencrypt/live/bkhouse.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bkhouse.tech/privkey.pem;

  client_max_body_size 25m;          # cho upload ảnh tin đăng

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SSE cho luồng RAG chatbox — KHÔNG buffer
  location /api/no-auth/chat/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
  }

  location /socket.io/ {
    proxy_pass http://socket:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}