server {
  listen 80;
  server_name bkhouse.tech www.bkhouse.tech;

  # Docker embedded DNS: phân giải tên service lúc CHẠY, không phải lúc khởi động
  resolver 127.0.0.11 valid=10s ipv6=off;

  # để Let's Encrypt xác thực domain
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  client_max_body_size 25m;

  location / {
    set $up_frontend frontend;
    proxy_pass http://$up_frontend:80;
    proxy_set_header Host $host;
  }

  location /api/ {
    set $up_backend backend;
    proxy_pass http://$up_backend:7979;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SSE cho chatbox RAG — KHÔNG buffer
  location /api/no-auth/chat/ {
    set $up_chat backend;
    proxy_pass http://$up_chat:7979;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /socket.io/ {
    set $up_socket socket;
    proxy_pass http://$up_socket:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
